<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <style>
    .hat{animation:lower .7s cubic-bezier(.2,.8,.2,1) both}
    .eye{transform-box:fill-box;transform-origin:center;animation:open .35s .75s cubic-bezier(.3,1.4,.5,1) both}
    @keyframes lower{from{opacity:0;transform:translateY(-36px)}to{opacity:1;transform:none}}
    @keyframes open{0%{transform:scaleY(0)}70%{transform:scaleY(1.08)}100%{transform:none}}
    @media (prefers-reduced-motion:reduce){.hat,.eye{animation:none}}
  </style>
