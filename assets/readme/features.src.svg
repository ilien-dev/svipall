<text id="eyebrow" x="56" y="56" class="m" font-size="14" fill="$accent_text" letter-spacing="2">WHAT YOUR AI CAN DO</text><text id="title" x="56" y="108" class="b" font-size="40" fill="$ink">One add-on, five new abilities</text><text id="sub" x="56" y="146" class="s" font-size="18" fill="$body">Each column is one thing your AI can now do.</text>
