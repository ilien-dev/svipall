<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 448" width="1280" height="448" role="img" aria-label="One add-on gives your AI five abilities, standing as five columns in a field that light up one at a time, each also listed beside the field with a detail of it, the lit one highlighted: watch a video, search without a subscription, keep watch while you're away, pages into spreadsheets, open pages that block bots.">
<style>@keyframes bd{to{transform:translate(40px,40px)}}.bd{animation:bd 9.43s linear infinite}
/* 15 s, one ability lit every 3 s: column rises and turns red, its badge lights, the card names it
   lit   |in|========== 2.6 s ==========|out|  (each ability shifted by 3 s) */
@keyframes up{0%{transform:translateY(0)}3%,18%{transform:translateY(-30px)}21.5%,100%{transform:translateY(0)}}
@keyframes lit{0%{opacity:0}2%,18.5%{opacity:1}21%,100%{opacity:0}}
@keyframes card{0%{opacity:0;transform:translateY(10px)}2%,18.5%{opacity:1;transform:translateY(0)}20.5%,100%{opacity:0;transform:translateY(-10px)}}
@keyframes pz{0%,100%{opacity:0}50%{opacity:.45}}
.up{animation:up 15s cubic-bezier(.4,0,.2,1) infinite}
.lit{animation:lit 15s ease-in-out infinite}
.card{animation:card 15s ease-in-out infinite}
.pz{animation:pz 5s ease-in-out infinite}</style>
