<!--palette
bg          #050506 #F3F1EF
panel       #141417 #FFFFFF
panel2      #1F1F24 #ECE8E4
line        #2A2A2E #DAD4CE
ink         #EDEBE8 #0D0D0F
body        #DEDBD7 #3E3B38
muted       #B4B0AC #5E5A56
accent      #E5303A #D3202F
accent_text #FFA3A8 #B51A28
read        #F3F1EF #0D0D0F
refused     #6A6A70 #9A958F
heat1       #3A0F2C #ECC6C9
heat2       #8A1D3A #E58A91
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 448" width="1280" height="448" role="img" aria-label="A Claude Code window where three lines are typed one at a time: /plugin marketplace add ilien-dev/svipall, /plugin install svipall@svipall, /svipall:setup. Each line sends a red parcel to a checklist beside it, whose rows turn from working to done: marketplace added, add-on installed, checked that it works, says when updates come.">
<style>@keyframes bd{to{transform:translate(40px,40px)}}.bd{animation:bd 9.43s linear infinite}
/* 15 s   line 1 typed |--|  parcel |-|  row 1 runs |--| done ======================== cleared
                       line 2 typed |--|  parcel |-|  row 2 runs |--| done ============== cleared
                                     line 3 typed |-| parcel |-| rows 3 and 4 run, done ===== cleared */
@keyframes caret{0%,100%{opacity:1}50%{opacity:0}}.caret{animation:caret 1.1s steps(1,end) infinite}
@keyframes cin{0%,48%{opacity:0}49%,95%{opacity:1}96%,100%{opacity:0}}.cin{animation:cin 15s linear infinite}
@keyframes dot{0%,100%{opacity:.3}50%{opacity:1}}.dot{animation:dot 1.2s ease-in-out infinite}
@keyframes ty0{0%,3%{transform:translateX(-395.6px);animation-timing-function:steps(41,end)}13%,95.0%{transform:translateX(0);animation-timing-function:steps(41,end)}100%{transform:translateX(-395.6px)}}.ty0{animation:ty0 15s linear infinite}
@keyframes ty1{0%,25%{transform:translateX(-299.6px);animation-timing-function:steps(31,end)}32%,96.5%{transform:translateX(0);animation-timing-function:steps(31,end)}100%{transform:translateX(-299.6px)}}.ty1{animation:ty1 15s linear infinite}
@keyframes ty2{0%,44%{transform:translateX(-136.4px);animation-timing-function:steps(14,end)}48%,98.0%{transform:translateX(0);animation-timing-function:steps(14,end)}100%{transform:translateX(-136.4px)}}.ty2{animation:ty2 15s linear infinite}
@keyframes run0{0%,17%{opacity:0}18%,22%{opacity:1}23%,100%{opacity:0}}.run0{animation:run0 15s ease-in-out infinite}@keyframes done0{0%,22%{opacity:0;transform:translateY(6px)}24%,88%{opacity:1;transform:translateY(0)}90%,100%{opacity:0;transform:translateY(6px)}}.done0{animation:done0 15s cubic-bezier(0,0,.2,1) infinite}
@keyframes run1{0%,36%{opacity:0}37%,41%{opacity:1}42%,100%{opacity:0}}.run1{animation:run1 15s ease-in-out infinite}@keyframes done1{0%,41%{opacity:0;transform:translateY(6px)}43%,90%{opacity:1;transform:translateY(0)}92%,100%{opacity:0;transform:translateY(6px)}}.done1{animation:done1 15s cubic-bezier(0,0,.2,1) infinite}
@keyframes run2{0%,52%{opacity:0}53%,57%{opacity:1}58%,100%{opacity:0}}.run2{animation:run2 15s ease-in-out infinite}@keyframes done2{0%,57%{opacity:0;transform:translateY(6px)}59%,92%{opacity:1;transform:translateY(0)}94%,100%{opacity:0;transform:translateY(6px)}}.done2{animation:done2 15s cubic-bezier(0,0,.2,1) infinite}
@keyframes run3{0%,57%{opacity:0}58%,62%{opacity:1}63%,100%{opacity:0}}.run3{animation:run3 15s ease-in-out infinite}@keyframes done3{0%,62%{opacity:0;transform:translateY(6px)}64%,94%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(6px)}}.done3{animation:done3 15s cubic-bezier(0,0,.2,1) infinite}
@keyframes pc0{0%,13.5%{opacity:0;transform:translate(0,0)}14.3%{opacity:1;transform:translate(0,0)}17.4%{opacity:1;transform:translate(114px,-188px)}18%,100%{opacity:0;transform:translate(114px,-188px)}}.pc0{animation:pc0 15s cubic-bezier(.4,0,.2,1) infinite}
@keyframes pc1{0%,32.5%{opacity:0;transform:translate(0,0)}33.3%{opacity:1;transform:translate(0,0)}36.4%{opacity:1;transform:translate(114px,-144px)}37%,100%{opacity:0;transform:translate(114px,-144px)}}.pc1{animation:pc1 15s cubic-bezier(.4,0,.2,1) infinite}
@keyframes pc2{0%,48.5%{opacity:0;transform:translate(0,0)}49.3%{opacity:1;transform:translate(0,0)}52.4%{opacity:1;transform:translate(114px,-100px)}53%,100%{opacity:0;transform:translate(114px,-100px)}}.pc2{animation:pc2 15s cubic-bezier(.4,0,.2,1) infinite}</style>
<defs><clipPath id="row0"><rect x="100" y="244" width="510" height="26"/></clipPath><clipPath id="row1"><rect x="100" y="298" width="510" height="26"/></clipPath><clipPath id="row2"><rect x="100" y="352" width="510" height="26"/></clipPath></defs>
<rect width="1280" height="448" fill="$bg"/>
<g id="backdrop" data-backdrop="grid drift"><defs><pattern id="bd-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40M0 0V40" fill="none" stroke="$line" stroke-width="1"/></pattern></defs><rect x="-40" y="-40" width="1360" height="528" fill="url(#bd-grid)" class="bd"/></g>
<text id="eyebrow" x="56" y="56" class="m" font-size="14" fill="$accent_text" letter-spacing="2">INSTALL</text><text id="title" x="56" y="108" class="b" font-size="40" fill="$ink">Three lines in Claude Code</text><text id="sub" x="56" y="146" class="s" font-size="18" fill="$body">It installs Svipall, checks that it works and says when an update is out.</text>
<g id="stage">
<!-- what each line sets up -->
<rect x="690" y="36" width="550" height="76" rx="14" fill="$panel" stroke="$line" stroke-width="1.5"/><polygon points="714,60 734,70 734,96 714,86" fill="$line"/><polygon points="754,60 734,70 734,96 754,86" fill="$panel"/><polygon points="734,50 754,60 734,70 714,60" fill="$panel2" stroke="$line" stroke-width="1"/><text x="782" y="81.0" class="s" font-size="20" fill="$ink">Marketplace added</text><g class="run0" opacity="0"><polygon points="714,60 734,70 734,96 714,86" fill="$heat2"/><polygon points="754,60 734,70 734,96 754,86" fill="$heat1"/><polygon points="734,50 754,60 734,70 714,60" fill="$accent" stroke="$line" stroke-width="1"/><circle class="dot" cx="1174" cy="74.0" r="4" fill="$accent"/><circle class="dot" style="animation-delay:-.4s" cx="1188" cy="74.0" r="4" fill="$accent"/><circle class="dot" style="animation-delay:-.8s" cx="1202" cy="74.0" r="4" fill="$accent"/></g><g class="done0"><polygon points="714,60 734,70 734,96 714,86" fill="$muted"/><polygon points="754,60 734,70 734,96 754,86" fill="$refused"/><polygon points="734,50 754,60 734,70 714,60" fill="$read" stroke="$line" stroke-width="1"/><g data-asset="lucide:circle-check" data-icon="done" data-size="32" transform="translate(1182 58) scale(1.333)" fill="$accent"><g fill="none" stroke="$accent" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m16 9l-5.5 5.5L8 12"/></g></g></g><rect x="690" y="134" width="550" height="76" rx="14" fill="$panel" stroke="$line" stroke-width="1.5"/><polygon points="714,158 734,168 734,194 714,184" fill="$line"/><polygon points="754,158 734,168 734,194 754,184" fill="$panel"/><polygon points="734,148 754,158 734,168 714,158" fill="$panel2" stroke="$line" stroke-width="1"/><text x="782" y="179.0" class="s" font-size="20" fill="$ink">Add-on installed</text><g class="run1" opacity="0"><polygon points="714,158 734,168 734,194 714,184" fill="$heat2"/><polygon points="754,158 734,168 734,194 754,184" fill="$heat1"/><polygon points="734,148 754,158 734,168 714,158" fill="$accent" stroke="$line" stroke-width="1"/><circle class="dot" cx="1174" cy="172.0" r="4" fill="$accent"/><circle class="dot" style="animation-delay:-.4s" cx="1188" cy="172.0" r="4" fill="$accent"/><circle class="dot" style="animation-delay:-.8s" cx="1202" cy="172.0" r="4" fill="$accent"/></g><g class="done1"><polygon points="714,158 734,168 734,194 714,184" fill="$muted"/><polygon points="754,158 734,168 734,194 754,184" fill="$refused"/><polygon points="734,148 754,158 734,168 714,158" fill="$read" stroke="$line" stroke-width="1"/><g data-asset="lucide:circle-check" data-icon="done" data-size="32" transform="translate(1182 156) scale(1.333)" fill="$accent"><g fill="none" stroke="$accent" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m16 9l-5.5 5.5L8 12"/></g></g></g><rect x="690" y="232" width="550" height="76" rx="14" fill="$panel" stroke="$line" stroke-width="1.5"/><polygon points="714,256 734,266 734,292 714,282" fill="$line"/><polygon points="754,256 734,266 734,292 754,282" fill="$panel"/><polygon points="734,246 754,256 734,266 714,256" fill="$panel2" stroke="$line" stroke-width="1"/><text x="782" y="277.0" class="s" font-size="20" fill="$ink">Checked: it works</text><g class="run2" opacity="0"><polygon points="714,256 734,266 734,292 714,282" fill="$heat2"/><polygon points="754,256 734,266 734,292 754,282" fill="$heat1"/><polygon points="734,246 754,256 734,266 714,256" fill="$accent" stroke="$line" stroke-width="1"/><circle class="dot" cx="1174" cy="270.0" r="4" fill="$accent"/><circle class="dot" style="animation-delay:-.4s" cx="1188" cy="270.0" r="4" fill="$accent"/><circle class="dot" style="animation-delay:-.8s" cx="1202" cy="270.0" r="4" fill="$accent"/></g><g class="done2"><polygon points="714,256 734,266 734,292 714,282" fill="$muted"/><polygon points="754,256 734,266 734,292 754,282" fill="$refused"/><polygon points="734,246 754,256 734,266 714,256" fill="$read" stroke="$line" stroke-width="1"/><g data-asset="lucide:circle-check" data-icon="done" data-size="32" transform="translate(1182 254) scale(1.333)" fill="$accent"><g fill="none" stroke="$accent" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m16 9l-5.5 5.5L8 12"/></g></g></g><rect x="690" y="330" width="550" height="76" rx="14" fill="$panel" stroke="$line" stroke-width="1.5"/><polygon points="714,354 734,364 734,390 714,380" fill="$line"/><polygon points="754,354 734,364 734,390 754,380" fill="$panel"/><polygon points="734,344 754,354 734,364 714,354" fill="$panel2" stroke="$line" stroke-width="1"/><text x="782" y="375.0" class="s" font-size="20" fill="$ink">Says when updates come</text><g class="run3" opacity="0"><polygon points="714,354 734,364 734,390 714,380" fill="$heat2"/><polygon points="754,354 734,364 734,390 754,380" fill="$heat1"/><polygon points="734,344 754,354 734,364 714,354" fill="$accent" stroke="$line" stroke-width="1"/><circle class="dot" cx="1174" cy="368.0" r="4" fill="$accent"/><circle class="dot" style="animation-delay:-.4s" cx="1188" cy="368.0" r="4" fill="$accent"/><circle class="dot" style="animation-delay:-.8s" cx="1202" cy="368.0" r="4" fill="$accent"/></g><g class="done3"><polygon points="714,354 734,364 734,390 714,380" fill="$muted"/><polygon points="754,354 734,364 734,390 754,380" fill="$refused"/><polygon points="734,344 754,354 734,364 714,354" fill="$read" stroke="$line" stroke-width="1"/><g data-asset="lucide:circle-check" data-icon="done" data-size="32" transform="translate(1182 352) scale(1.333)" fill="$accent"><g fill="none" stroke="$accent" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m16 9l-5.5 5.5L8 12"/></g></g></g>
<!-- Claude Code, where the three lines are typed -->
<g data-kit="window"><rect x="56" y="186" width="580" height="232" rx="12" fill="$panel" stroke="$line" stroke-width="1.5"/><path d="M56 220H636" stroke="$line" stroke-width="1.5"/><circle cx="76" cy="203" r="5" fill="$line"/><circle cx="92" cy="203" r="5" fill="$line"/><circle cx="108" cy="203" r="5" fill="$line"/><text x="346.0" y="208" class="m" font-size="14" fill="$muted" text-anchor="middle">Claude Code</text></g><text x="80" y="262" class="m" font-size="16" fill="$accent_text">&gt;</text><text x="102" y="262" class="m" font-size="16" fill="$ink">/plugin marketplace add ilien-dev/svipall</text><g clip-path="url(#row0)"><rect class="ty0" x="497.6" y="245" width="401.6" height="24" fill="$panel"/></g><text x="80" y="316" class="m" font-size="16" fill="$accent_text">&gt;</text><text x="102" y="316" class="m" font-size="16" fill="$ink">/plugin install svipall@svipall</text><g clip-path="url(#row1)"><rect class="ty1" x="401.6" y="299" width="305.6" height="24" fill="$panel"/></g><text x="80" y="370" class="m" font-size="16" fill="$accent_text">&gt;</text><text x="102" y="370" class="m" font-size="16" fill="$ink">/svipall:setup</text><g clip-path="url(#row2)"><rect class="ty2" x="238.4" y="353" width="142.4" height="24" fill="$panel"/></g><g class="cin" opacity="0"><rect class="caret" x="238.4" y="356" width="9" height="18" fill="$accent"/></g>
<g transform="translate(596 249)"><g class="pc0" opacity="0"><rect width="26" height="26" rx="7" fill="$accent"/><path d="M8 13h10M14 8l5 5-5 5" fill="none" stroke="$read" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(596 303)"><g class="pc1" opacity="0"><rect width="26" height="26" rx="7" fill="$accent"/><path d="M8 13h10M14 8l5 5-5 5" fill="none" stroke="$read" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(596 357)"><g class="pc2" opacity="0"><rect width="26" height="26" rx="7" fill="$accent"/><path d="M8 13h10M14 8l5 5-5 5" fill="none" stroke="$read" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g></g>
