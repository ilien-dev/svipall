name: build-check

# The release's build matrix, without the release. Run it by hand before bumping a version, or on a
# branch that changes how an artefact is built — which is exactly when the expensive failure is a
# tag that cannot publish.
#
# It exists because nothing else covers this path. `ci.yml` builds with the default features on
# three runners, so it links the ONNX Runtime `ort` downloads and never exercises the one built
# from source; the release job does, and only on a version bump. Three targets build their own
# runtime, and two of those — x86-64 macOS and arm64 Linux — cannot be tested anywhere but a
# runner of their own.
#
# Disposable on purpose: delete it the day something cheaper covers the same ground.

on:
  workflow_dispatch:
  # `workflow_dispatch` alone is unreachable until the file is on the default branch, which is
  # exactly backwards for a check whose job is to vet a branch before it gets there. A pull request
  # that touches how an artefact is built runs it from the branch's own copy. The `push` line names
  # the branch this arrived on and comes out with it.
  push:
    branches: [linux-models-artifact]
  pull_request:
    paths:
      - "tools/onnxruntime/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/build-check.yml"
      - "Cargo.lock"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            ort_source: false
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            ort_source: false
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
            ort_source: true
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ""
            ort_source: true
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ""
            ort_source: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: BoringSSL build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake perl pkg-config libclang-dev nasm

      - name: BoringSSL build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config llvm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The same cache the release restores, so a green run here also leaves the release a warm one.
      - uses: actions/cache@v4
        if: matrix.ort_source
        id: ort-cache
        with:
          path: .ort/build/Release
          key: ort-${{ hashFiles('tools/onnxruntime/VERSION') }}-${{ matrix.target }}

      - name: ONNX Runtime from source
        if: matrix.ort_source
        shell: bash
        run: |
          if [ "${{ steps.ort-cache.outputs.cache-hit }}" != "true" ]; then
            case "${{ matrix.target }}" in
              x86_64-*) arch=x86_64 ;;
              aarch64-apple-*) arch=arm64 ;;
              aarch64-*) arch=aarch64 ;;
            esac
            tools/onnxruntime/build.sh "$PWD/.ort" "$arch"
          fi
          echo "ORT_LIB_LOCATION=$PWD/.ort/build/Release" >> "$GITHUB_ENV"
          echo "ORT_EXTRA_RUSTFLAGS=$(cat "$PWD/.ort/extra-rustflags" 2>/dev/null)" >> "$GITHUB_ENV"

      - name: Export embedded models
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              python -m pip install --quiet torch torchvision ;;
            *)
              python -m pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu ;;
          esac
          python -m pip install --quiet onnx
          python tools/models/export.py
          ls -la crates/svipall-models/models

      - name: Build
        shell: bash
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v2
          CARGO_TARGET_DIR: ${{ runner.os == 'Windows' && 'C:\t' || './t' }}
        run: |
          case "${{ matrix.target }}" in aarch64-*) RUSTFLAGS= ;; esac
          RUSTFLAGS="$RUSTFLAGS ${ORT_EXTRA_RUSTFLAGS:-}"
          cargo build --no-default-features --profile dist --target ${{ matrix.target }} --bin svipall-mcp --bin svipall \
            --features impersonate,onnx-ocr,onnx-grid,onnx-audio,onnx-detect,onnx-segment,onnx-zeroshot

      # A cross-built artefact cannot run here, which is why x86-64 macOS is skipped: that leg
      # proves it links, and a runner of its own would be needed to prove it starts.
      - name: Answers with its models
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.os == 'Windows' && 'C:\t' || './t' }}
        run: |
          bin="$CARGO_TARGET_DIR/${{ matrix.target }}/dist/svipall${{ matrix.ext }}"
          "$bin" --version
          "$bin" doctor | tee doctor.json
          grep -q '"detect"' doctor.json
          grep -q '"segment"' doctor.json
          ! grep -q '"no_models"' doctor.json

      # The whole point of building the runtime rather than downloading one: the artefact still
      # starts where the downloaded runtime could not, and answers there.
      - name: Runs on an older distribution, with its models
        if: contains(matrix.target, 'linux')
        shell: bash
        run: |
          run() { docker run --rm -v "$PWD/t/${{ matrix.target }}/dist:/x" debian:bookworm-slim "$@"; }
          run /x/svipall --version
          run /x/svipall doctor | tee doctor-bookworm.json
          grep -q '"detect"' doctor-bookworm.json
          grep -q '"segment"' doctor-bookworm.json
