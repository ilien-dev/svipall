name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # One version, asserted in one place. Four files claim it — the crate, the plugin manifest, the
  # npm wrapper and the tag — and each one is a different way to be wrong: Claude Code silently
  # keeps a cached plugin when `plugin.json` repeats a version it has already seen, and the npm
  # postinstall builds its download URL from its own version, so a package one behind fetches an
  # archive that does not exist.
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          crate=$(grep -m1 '^version' crates/svipall-mcp/Cargo.toml | cut -d'"' -f2)
          plugin=$(python3 -c "import json;print(json.load(open('plugins/svipall/.claude-plugin/plugin.json'))['version'])")
          npm=$(python3 -c "import json;print(json.load(open('packaging/npm/package.json'))['version'])")
          for pair in "plugin.json:$plugin" "npm/package.json:$npm"; do
            if [ "${pair#*:}" != "$crate" ]; then
              echo "the crate says $crate, ${pair%%:*} says ${pair#*:}" >&2
              exit 1
            fi
          done
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$crate" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version $crate" >&2
            exit 1
          fi
          # A semver pre-release is anything with a hyphen. It decides two things: GitHub marks the
          # release as a pre-release, and the moving container tags stay where they are.
          case "$crate" in *-*) pre=true ;; *) pre=false ;; esac
          echo "version=$crate" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "version $crate, prerelease $pre"

  build:
    name: ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            models: true
          # The one target with no local model inference. ONNX Runtime publishes no x86_64 macOS
          # build at the version `ort` is pinned to, and `download-binaries` fails the build rather
          # than falling back, so this artefact is built without the `onnx-*` features — and
          # without the weights nothing in it could read. Image captchas go to the human dashboard,
          # `svipall doctor` reports `no_models`, and the platform table says so out loud.
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
            models: false
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            models: true
          # Linux builds on 22.04 and without the model features, and the two are the same
          # decision. A binary links the glibc of the machine that built it, so `ubuntu-latest`
          # produced one needing GLIBC_2.39 that would not start on Debian 12, Ubuntu 22.04 or
          # RHEL 9. Building on 22.04 fixes that, and then the ONNX Runtime binaries `ort`
          # downloads will not link there at all: they reference glibc 2.38 symbols and GCC 13's
          # libstdc++. One or the other, and a binary that starts everywhere beats a binary that
          # answers image captchas on Ubuntu 24. The container image keeps the models, because a
          # container carries its own glibc. `Runs on an older distribution` below is the gate.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ""
            models: false
          # Native arm runner: BoringSSL cross-compiles badly and does not need to.
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ""
            models: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: BoringSSL build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake perl pkg-config libclang-dev nasm

      - name: BoringSSL build dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install cmake strawberryperl pkgconfiglite llvm nasm -y
        shell: cmd

      - name: BoringSSL build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config llvm

      # The models the binary carries. torchvision's published weights (BSD-3), exported once
      # here and compiled in by svipall-models; nothing is fetched at run time. The CPU wheel is
      # enough: exporting is not training.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export embedded models
        if: matrix.models
        shell: bash
        run: |
          python -m pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet onnx
          python tools/models/export.py
          ls -la crates/svipall-models/models

      # A portable baseline, replacing the target-cpu=native in .cargo/config.toml. RUSTFLAGS as an
      # environment variable replaces that section outright, which is what we want here. The
      # baseline is an x86 one, so every aarch64 target drops it.
      - name: Build
        shell: bash
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v2
          # Keep BoringSSL's nested build paths under Windows MAX_PATH.
          CARGO_TARGET_DIR: ${{ runner.os == 'Windows' && 'C:\t' || './t' }}
        run: |
          # Empty, not unset: unsetting it hands the build back to .cargo/config.toml and
          # its `target-cpu=native`, which `ring` rejects on aarch64 apple targets.
          case "${{ matrix.target }}" in aarch64-*) RUSTFLAGS= ;; esac
          if [ "${{ matrix.models }}" = "true" ]; then
            feats="--features impersonate,onnx-ocr,onnx-grid,onnx-audio,onnx-detect,onnx-segment,onnx-zeroshot"
          else
            feats="--features impersonate"
          fi
          cargo build --no-default-features --profile dist --target ${{ matrix.target }} --bin svipall-mcp --bin svipall $feats

      # Ad-hoc, because notarisation needs an Apple Developer ID this project does not have. It
      # stops the "damaged and can't be opened" dialog for a binary copied between machines; a
      # download through a browser still carries the quarantine flag, which docs/install.md says
      # how to clear. Claiming more than that would be a lie a user finds out about alone.
      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CARGO_TARGET_DIR: ./t
        run: |
          codesign --force --sign - "$CARGO_TARGET_DIR/${{ matrix.target }}/dist/svipall"
          codesign --force --sign - "$CARGO_TARGET_DIR/${{ matrix.target }}/dist/svipall-mcp"

      # The binary that is about to be published, asked what it is. A cross-built artefact cannot
      # run here, so this is the four native targets telling us the build is not, for instance,
      # missing its models — which is exactly the failure the container image used to ship.
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.os == 'Windows' && 'C:\t' || './t' }}
        run: |
          bin="$CARGO_TARGET_DIR/${{ matrix.target }}/dist/svipall${{ matrix.ext }}"
          "$bin" --version
          "$bin" --version | grep -q '"target": "${{ matrix.target }}"'
          # No browser on a CI runner, so `doctor` reports problems and that is correct. What must
          # hold is that the models made it in.
          "$bin" doctor | tee doctor.json
          # Asserted both ways, because "no models" is a real answer for some targets and a
          # regression for others, and only the matrix knows which this is.
          if [ "${{ matrix.models }}" = "true" ]; then
            grep -q '"detect"' doctor.json
            grep -q '"segment"' doctor.json
          else
            grep -q '"no_models"' doctor.json
          fi

      # The binary that is about to be published, started on a distribution older than the one
      # that built it. A glibc that is too new is invisible here otherwise: the runner has it, so
      # everything passes, and the first person on Debian gets `GLIBC_2.39 not found`.
      - name: Runs on an older distribution
        if: contains(matrix.target, 'linux')
        shell: bash
        env:
          CARGO_TARGET_DIR: ./t
        run: |
          docker run --rm -v "$PWD/t/${{ matrix.target }}/dist:/x" debian:bookworm-slim             /x/svipall --version

      # Both binaries: the MCP server and the CLI the skill documents. Shipping only the server
      # left `svipall fetch` a build-from-source feature.
      #
      # `.zip` on Windows and `.tar.gz` everywhere else. Not cosmetic: winget will not take a
      # `.tar.gz`, Scoop will not either, and Windows Explorer opens one only with help.
      - name: Package
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.os == 'Windows' && 'C:\t' || './t' }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p out
          cp "$CARGO_TARGET_DIR/${{ matrix.target }}/dist/svipall-mcp${{ matrix.ext }}" out/
          cp "$CARGO_TARGET_DIR/${{ matrix.target }}/dist/svipall${{ matrix.ext }}" out/
          cp README.md LICENSE skill/SKILL.md out/
          cd out
          name="svipall-$VERSION-${{ matrix.target }}"
          files="svipall-mcp${{ matrix.ext }} svipall${{ matrix.ext }} README.md LICENSE SKILL.md"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$name.zip" $files
          else
            tar -czf "$name.tar.gz" $files
          fi
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: svipall-${{ matrix.target }}
          path: |
            out/*.tar.gz
            out/*.zip
          if-no-files-found: error

  # The manifests and the native Linux packages, from the artefacts the build job just produced.
  # Nothing is recompiled: a package manager that ships a different build from the tarball is a
  # second product to support.
  packages:
    name: packages
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum svipall-*.tar.gz svipall-*.zip > sha256sums.txt

      - name: Render package manifests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash scripts/render-packaging.sh "$VERSION" artifacts/sha256sums.txt packaging/dist

      # amd64 only, and said out loud rather than left to be discovered: arm64 users get the
      # tarball and install.sh, which is what they were going to use anyway.
      - name: Build .deb and .rpm (amd64)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked
          mkdir -p packaging/staging
          tar -xzf "artifacts/svipall-$VERSION-x86_64-unknown-linux-gnu.tar.gz" -C packaging/staging
          # Neither format takes a semver pre-release as it is written. RPM rejects the hyphen
          # outright; dpkg accepts it and then sorts 1.0.0-rc *above* 1.0.0, so a user on the
          # candidate would never be offered the release. `~` is the character both use for
          # "sorts before", which is what a pre-release is.
          PKGVER="${VERSION//-/\~}"
          cargo deb -p svipall-mcp --no-build --no-strip --deb-version "$PKGVER" --output packaging/dist/
          cargo generate-rpm -p crates/svipall-mcp --output packaging/dist/ -s "version = \"$PKGVER\""

      # Only the manifests. They live beside the .deb and the .rpm, and the first release bundled
      # all of it into a 282 MB "manifests" tarball that duplicated both packages.
      - name: Bundle the manifests
        run: |
          cd packaging/dist
          tar -czf ../../packaging-manifests.tar.gz homebrew scoop aur winget
          ls -la ../../packaging-manifests.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            packaging-manifests.tar.gz
            packaging/dist/*.deb
            packaging/dist/*.rpm
          if-no-files-found: error

  publish:
    name: publish
    needs: [version, build, packages]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum svipall-*.tar.gz svipall-*.zip > sha256sums.txt && cat sha256sums.txt
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      # Nothing here is notarised or Authenticode-signed, so this is what a careful user actually
      # has: a signed statement, verifiable with `gh attestation verify`, that GitHub built these
      # files from this commit of this repository.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "artifacts/svipall-*"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/svipall-*.tar.gz
            artifacts/svipall-*.zip
            artifacts/sha256sums.txt
            packages/packaging-manifests.tar.gz
            packages/packaging/dist/*.deb
            packages/packaging/dist/*.rpm
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}

  # npm, over OIDC and with no stored secret. `id-token: write` is the whole mechanism: npm trades
  # the token GitHub mints for a short-lived publish credential, having been told on npmjs.com that
  # this repository and this workflow file may do it. It also generates a provenance attestation by
  # itself, which is the same guarantee the release assets carry.
  #
  # `needs: publish` and not just `build`: the package is five files and a postinstall that fetches
  # the release archive, so publishing it before the release exists would ship a package that
  # cannot install.
  npm:
    name: npm
    needs: [version, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      # OIDC publishing needs a recent npm; the one bundled with the Node LTS image is older than
      # the feature.
      - run: npm install -g npm@latest
      - name: Publish
        working-directory: packaging/npm
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Re-running a tag must not fail the release. A version already on the registry is the
          # normal outcome of a re-run, not a problem to report.
          if npm view "svipall@$VERSION" version >/dev/null 2>&1; then
            echo "svipall@$VERSION is already published; nothing to do"
            exit 0
          fi
          tag=latest
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
            tag=next
          fi
          npm publish --tag "$tag" --access public

  # One architecture per runner, each on its own hardware. The previous shape asked one amd64
  # runner to build arm64 through QEMU, and a Rust build with BoringSSL and fat LTO under emulation
  # ran past thirty minutes without finishing while the native amd64 half took eight. Each job here
  # pushes an untagged image by digest; `image-manifest` below is what turns the digests into a tag.
  image:
    name: image ${{ matrix.flavor }} ${{ matrix.arch }}
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both flavours, both architectures. The arm64 `full` image is the only way to run
          # everything on arm64 Linux at all: that binary can carry neither the models (glibc) nor
          # a managed browser (Chrome for Testing publishes no linux-arm64 build), so the image
          # uses the distribution's Chromium instead and says so.
          - flavor: full
            arch: amd64
            os: ubuntu-22.04
          - flavor: full
            arch: arm64
            os: ubuntu-22.04-arm
          - flavor: slim
            arch: amd64
            os: ubuntu-22.04
          - flavor: slim
            arch: arm64
            os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: FLAVOR=${{ matrix.flavor }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.flavor }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

  # The tags, made from whatever architectures that flavour produced.
  image-manifest:
    name: image manifest (${{ matrix.flavor }})
    needs: [version, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: full
            suffix: ""
            moving: latest
          - flavor: slim
            suffix: "-slim"
            moving: slim
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.flavor }}-*
          path: /tmp/digests
          merge-multiple: true
      # A moving tag is a promise that whoever pulls it gets the release. A pre-release is by
      # definition not that, so it publishes its own version tag and leaves `latest` and `slim`
      # pointing wherever they already pointed.
      - name: Create the manifest
        shell: bash
        run: |
          repo="ghcr.io/${{ github.repository }}"
          tags="-t $repo:${{ needs.version.outputs.version }}${{ matrix.suffix }}"
          if [ "${{ needs.version.outputs.prerelease }}" != "true" ]; then
            tags="$tags -t $repo:${{ matrix.moving }}"
          fi
          refs=""
          for f in /tmp/digests/*; do
            refs="$refs $repo@$(cat "$f")"
          done
          [ -n "$refs" ] || { echo "no digests for ${{ matrix.flavor }}" >&2; exit 1; }
          echo "creating$tags from$refs"
          docker buildx imagetools create $tags $refs
          docker buildx imagetools inspect "$repo:${{ needs.version.outputs.version }}${{ matrix.suffix }}"
