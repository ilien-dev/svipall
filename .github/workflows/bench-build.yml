# Throwaway, round 3. Round 1 put the Windows build variants inside a 20.1-24.2 min band, and
# macOS showed 17% spread between two runners doing identical work, so n=1 decided nothing.
# Three repetitions per variant, so a median can be compared against a range.
name: bench-build

on:
  push:
    branches: ["perf/**"]
    paths: [".github/workflows/bench-build.yml"]
  workflow_dispatch:

concurrency:
  group: bench-build
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.variant }}-${{ matrix.rep }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
        variant: [base, nochoco, nochoco-defender]
    steps:
      - uses: actions/checkout@v4

      # Real-time scanning reads and writes every .o, .rlib and .pdb the build produces.
      - name: Defender exclusion
        if: matrix.variant == 'nochoco-defender'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath 'C:\t'
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionProcess 'rustc.exe','cargo.exe','link.exe','cl.exe'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Round 1 established that windows-latest already carries cmake, Strawberry Perl, LLVM and
      # nasm, and that a build using them succeeds. This step is the control, not a requirement.
      - name: Toolchain deps (choco)
        if: matrix.variant == 'base'
        run: choco install cmake strawberryperl pkgconfiglite llvm nasm -y
        shell: cmd

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export embedded models
        shell: bash
        run: |
          s=$(date +%s)
          python -m pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet onnx
          python tools/models/export.py
          echo "### ${{ matrix.variant }}-${{ matrix.rep }} models $(( $(date +%s) - s ))s" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        shell: bash
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v2
          CARGO_TARGET_DIR: 'C:\t'
        run: |
          s=$(date +%s)
          cargo build --no-default-features --profile dist --target x86_64-pc-windows-msvc \
            --bin svipall-mcp --bin svipall \
            --features impersonate,onnx-ocr,onnx-grid,onnx-audio,onnx-detect,onnx-segment,onnx-zeroshot
          d=$(( $(date +%s) - s ))
          echo "### BUILD ${{ matrix.variant }}-${{ matrix.rep }}: ${d}s ($((d/60))m$((d%60))s)" >> "$GITHUB_STEP_SUMMARY"

      # The binary the variant produced, asked what it is. A faster build that ships something
      # different is not a faster build.
      - name: Smoke test
        shell: bash
        run: |
          C:/t/x86_64-pc-windows-msvc/dist/svipall.exe --version
          C:/t/x86_64-pc-windows-msvc/dist/svipall.exe doctor | grep -q '"detect"'
