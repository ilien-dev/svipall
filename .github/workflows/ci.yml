name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # BoringSSL (via wreq) generates deeply nested build paths. On Windows the default target dir
  # blows past MAX_PATH and cmake fails with MSB4184, so keep the target directory short.
  CARGO_TARGET_DIR: ${{ github.workspace }}/t

jobs:
  qc:
    name: qc (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: BoringSSL build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake perl pkg-config libclang-dev

      - name: BoringSSL build dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install cmake strawberryperl pkgconfiglite llvm nasm -y
        shell: cmd

      - name: BoringSSL build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config llvm

      - name: Short target dir (Windows)
        if: runner.os == 'Windows'
        run: echo "CARGO_TARGET_DIR=C:\t" >> $env:GITHUB_ENV

      # .cargo/config.toml pins `target-cpu=native` for local builds, and RUSTFLAGS as an
      # environment variable replaces that section outright. On the aarch64 macOS runner `native`
      # enables features past the static baseline `ring` asserts for apple targets and it refuses
      # to compile, so this job builds portable.
      - name: Portable rustflags (macOS)
        if: runner.os == 'macOS'
        run: echo "RUSTFLAGS=" >> $GITHUB_ENV

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: clippy (onnx features)
        run: |
          cargo clippy -p svipall-mcp --all-targets --features onnx-ocr -- -D warnings
          cargo clippy -p svipall-mcp --all-targets --features onnx-grid -- -D warnings
          cargo clippy -p svipall-mcp --all-targets --features onnx-audio -- -D warnings
          cargo clippy -p svipall-mcp --all-targets --features onnx-detect -- -D warnings
          cargo clippy -p svipall-mcp --all-targets --features onnx-segment -- -D warnings
          cargo clippy -p svipall-mcp --all-targets --features onnx-zeroshot -- -D warnings

      - name: clippy (http3)
        run: cargo clippy -p svipall-mcp --all-targets --features http3 -- -D warnings

      - name: clippy (no impersonation fallback)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: tests
        run: cargo test --workspace

      # The QUIC handshake shape and the h3 fallback, both offline.
      - name: tests (http3)
        run: cargo test -p svipall-http --features http3 --test h3

      # A real ONNX Runtime session over the fixture graphs in tests/fixtures/models. Without
      # this step the inference modules were lint-checked and executed by nobody.
      - name: tests (onnx models)
        run: cargo test -p svipall-mcp --features onnx-grid,onnx-segment,onnx-detect --test models

      # CPU budgets and the exact structural counts: one DOM parse per page, no disk reads on a
      # cache lookup, pruning that removes the navigation and keeps the article. No network, and
      # until now it ran only on a developer's machine.
      - name: perf budgets
        run: cargo run -p svipall-bench --release -- micro --assert

      # Offline identity-coherence pass: Chrome, Firefox and phone identities checked against
      # themselves. No network. Fails the build on a cross-layer contradiction.
      - name: identity coherence
        run: cargo run -p svipall-bench --release -- fingerprint --engine chrome

      - name: unused dependencies
        run: |
          cargo install cargo-machete --locked
          cargo machete

      - name: CLAUDE.md size guard
        if: runner.os == 'Linux'
        run: bash scripts/check-claude-md.sh

      # The manifests a `/plugin install` reads. Cheap, and the failure they catch — a hooks file
      # in the wrong shape, a version the tag will not match — is one nobody sees until somebody
      # tries to install the thing.
      - name: plugin manifests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 -c "import json,sys; json.load(open('.claude-plugin/marketplace.json'))"
          python3 -c "import json,sys; json.load(open('plugins/svipall/.claude-plugin/plugin.json'))"
          python3 -c "import json,sys; json.load(open('plugins/svipall/hooks/hooks.json'))"
          python3 -c "import json,sys; json.load(open('plugins/svipall/.mcp.json'))"
          crate=$(grep -m1 '^version' crates/svipall-mcp/Cargo.toml | cut -d'"' -f2)
          plugin=$(python3 -c "import json; print(json.load(open('plugins/svipall/.claude-plugin/plugin.json'))['version'])")
          test "$crate" = "$plugin" || { echo "crate $crate != plugin $plugin"; exit 1; }
          # Every hook the plugin registers has to be a command this binary answers to.
          grep -q '"svipall hook claude-web"' plugins/svipall/hooks/hooks.json

      # The installers, run against the binaries this job just built. An installer that is only
      # ever exercised on release day is an installer nobody tested — the same argument the
      # container image step below already makes for the Dockerfile.
      - name: installer smoke (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh install.sh --help
          mkdir -p ci-pkg
          cp "$CARGO_TARGET_DIR/debug/svipall" "$CARGO_TARGET_DIR/debug/svipall-mcp" ci-pkg/
          (cd ci-pkg && tar -czf ../svipall-ci.tar.gz svipall svipall-mcp)
          # --no-browser: the prompt would otherwise offer a 190 MB download on a CI runner.
          sh install.sh --from-file svipall-ci.tar.gz --prefix "$PWD/ci-prefix" --no-path --no-browser
          "$PWD/ci-prefix/svipall" --version
          "$PWD/ci-prefix/svipall" doctor > /dev/null
          sh install.sh --uninstall --prefix "$PWD/ci-prefix"
          test ! -e "$PWD/ci-prefix/svipall"

      - name: installer smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-pkg | Out-Null
          Copy-Item -Path "$env:CARGO_TARGET_DIR\debug\svipall.exe","$env:CARGO_TARGET_DIR\debug\svipall-mcp.exe" -Destination ci-pkg
          Compress-Archive -Path ci-pkg\* -DestinationPath svipall-ci.zip -Force
          .\install.ps1 -FromFile svipall-ci.zip -Prefix "$PWD\ci-prefix" -NoPath -NoBrowser
          & "$PWD\ci-prefix\svipall.exe" --version
          & "$PWD\ci-prefix\svipall.exe" doctor > $null
          .\install.ps1 -Uninstall -Prefix "$PWD\ci-prefix"
          if (Test-Path "$PWD\ci-prefix\svipall.exe") { throw "uninstall left the binary behind" }

      # The image is built, never pushed, here: a Dockerfile that only works on release day is
      # a Dockerfile nobody tested. `slim` rather than `full`, because `full` also exports the
      # models through a torch download and the release workflow already runs that export on
      # every platform, on every dispatch.
      - name: container image builds
        if: runner.os == 'Linux'
        run: |
          docker build --build-arg FLAVOR=slim -t svipall:ci .
          docker run --rm svipall:ci svipall --version
