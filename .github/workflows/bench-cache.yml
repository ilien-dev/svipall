# Throwaway, round 4. Round 2 measured nothing: rust-cache's own log showed it saving the
# workspace `target` directory while the build wrote to the short CARGO_TARGET_DIR the project
# needs for BoringSSL under MAX_PATH. Its README is explicit that the `workspaces` target is
# "relative to the $workspace", so a directory outside it is not expressible there — the
# documented escape hatch is `cache-directories`. Linux and macOS have no MAX_PATH problem and
# simply drop the custom target dir, which lets rust-cache prune the way it was designed to.
#
# sccache never had this problem: it caches compiler invocations, not a directory. Its round 2
# entries are valid, so its warm numbers are measurable on this run.
name: bench-cache

on:
  push:
    branches: ["perf/**"]
    paths: [".github/workflows/bench-cache.yml"]
  workflow_dispatch:

concurrency:
  group: bench-cache
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: win-cachedirs
            os: windows-latest
            target: x86_64-pc-windows-msvc
            models: true
            cache: cache-directories
          - id: linux-default
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            models: false
            cache: rust-cache-default
          - id: mac-default
            os: macos-latest
            target: aarch64-apple-darwin
            models: true
            cache: rust-cache-default
          # Populated correctly in round 2, so these two are WARM on this run.
          - id: win-sccache
            os: windows-latest
            target: x86_64-pc-windows-msvc
            models: true
            cache: sccache
          - id: linux-sccache
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            models: false
            cache: sccache
    steps:
      - uses: actions/checkout@v4

      # The source change every real release carries. A hit rate measured on an unchanged tree is
      # an upper bound nobody will ever see.
      - name: Touch a core source file
        run: echo "// bench ${{ github.run_id }}" >> crates/svipall-core/src/lib.rs

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Windows only, and only because BoringSSL's nested build paths pass MAX_PATH otherwise.
      # Everywhere else cargo's default `target/` is what rust-cache knows how to find and prune.
      - name: Short target dir (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'CARGO_TARGET_DIR=C:\t' >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        if: matrix.cache == 'cache-directories'
        with:
          key: bench4-${{ matrix.id }}
          cache-targets: "false"
          cache-all-crates: "true"
          cache-directories: 'C:\t'

      - uses: Swatinem/rust-cache@v2
        if: matrix.cache == 'rust-cache-default'
        with:
          key: bench4-${{ matrix.id }}
          cache-all-crates: "true"

      - uses: mozilla-actions/sccache-action@v0.0.9
        if: matrix.cache == 'sccache'

      - name: sccache env
        if: matrix.cache == 'sccache'
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Toolchain deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake perl pkg-config libclang-dev nasm

      # Round 1 proved windows-latest already carries cmake, Strawberry Perl, LLVM and nasm.
      - name: Toolchain deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config llvm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export embedded models
        if: matrix.models
        shell: bash
        run: |
          python -m pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet onnx
          python tools/models/export.py

      - name: Build
        shell: bash
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v2
        run: |
          case "${{ matrix.target }}" in aarch64-*) RUSTFLAGS= ;; esac
          if [ "${{ matrix.models }}" = "true" ]; then
            feats="--features impersonate,onnx-ocr,onnx-grid,onnx-audio,onnx-detect,onnx-segment,onnx-zeroshot"
          else
            feats="--features impersonate"
          fi
          s=$(date +%s)
          cargo build --no-default-features --profile dist --target ${{ matrix.target }} \
            --bin svipall-mcp --bin svipall $feats
          d=$(( $(date +%s) - s ))
          echo "### ${{ matrix.id }}: ${d}s ($((d/60))m$((d%60))s)" >> "$GITHUB_STEP_SUMMARY"

      - name: sccache stats
        if: matrix.cache == 'sccache'
        shell: bash
        run: sccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"
