# Throwaway, round 3: what the container images cost, and what each candidate saves.
# Every run appends a line to a core source file first, because a release where nothing changed
# is not a release — the number that matters is the one after a real code change.
name: bench-image

on:
  push:
    branches: ["perf/**"]
    paths: [".github/workflows/bench-image.yml", ".github/bench/**"]
  workflow_dispatch:

concurrency:
  group: bench-image
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.id }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: slim-base
            flavor: slim
            dockerfile: Dockerfile
            cache: false
          - id: slim-gha
            flavor: slim
            dockerfile: Dockerfile
            cache: true
          - id: slim-chef
            flavor: slim
            dockerfile: .github/bench/Dockerfile.chef
            cache: true
          - id: full-base
            flavor: full
            dockerfile: Dockerfile
            cache: false
          - id: full-gha
            flavor: full
            dockerfile: Dockerfile
            cache: true
          - id: full-chef
            flavor: full
            dockerfile: .github/bench/Dockerfile.chef
            cache: true
    steps:
      - uses: actions/checkout@v4
      # The source change a real release carries.
      - name: Touch a core source file
        run: echo "// bench ${{ github.run_id }}" >> crates/svipall-core/src/lib.rs
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: |
          s=$(date +%s)
          args=""
          if [ "${{ matrix.cache }}" = "true" ]; then
            args="--cache-from type=gha,scope=${{ matrix.id }} --cache-to type=gha,mode=max,scope=${{ matrix.id }}"
          fi
          docker buildx build --load -f "${{ matrix.dockerfile }}" \
            --build-arg FLAVOR=${{ matrix.flavor }} -t svipall:${{ matrix.id }} $args .
          d=$(( $(date +%s) - s ))
          echo "### ${{ matrix.id }}: ${d}s ($((d/60))m$((d%60))s)" >> "$GITHUB_STEP_SUMMARY"
      - name: It runs
        run: docker run --rm svipall:${{ matrix.id }} svipall --version

  # The claim: `slim` is the http tier, which is the binary the release already built. Compiling
  # it again inside a container produces the same program.
  from-artifact:
    name: slim-artifact
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Fetch the published Linux binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.0-rc -p 'svipall-*-x86_64-unknown-linux-gnu.tar.gz' -O a.tar.gz
          mkdir -p bin && tar -xzf a.tar.gz -C bin svipall svipall-mcp && ls -la bin
      - name: Build
        run: |
          s=$(date +%s)
          docker buildx build --load -f .github/bench/Dockerfile.artifact -t svipall:artifact .
          d=$(( $(date +%s) - s ))
          echo "### slim-artifact: ${d}s" >> "$GITHUB_STEP_SUMMARY"
      - name: It runs, on this image's newer glibc
        run: |
          docker run --rm svipall:artifact svipall --version
          docker run --rm svipall:artifact svipall doctor | head -40
